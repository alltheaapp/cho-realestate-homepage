<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>홈페이지 문구 관리자 | 조광현 공인중개사 | v2.0</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="admin-body">
    <main class="admin-shell">
      <section class="admin-header">
        <div>
          <p class="hero-badge"><span></span> Content Admin</p>
          <h1>홈페이지 문구 관리자</h1>
          <p>문구를 수정하고 저장하면 <strong id="sync-status" style="color: orange;">연결 중...</strong></p>
        </div>
        <div class="admin-actions">
          <a class="secondary-button admin-link" href="index.html">홈 보기</a>
          <button type="button" data-check-sync>🔄 상태 확인</button>
          <button type="button" data-export>JSON 내보내기</button>
          <button type="button" class="danger" data-reset>초기화</button>
        </div>
      </section>

      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="home">홈페이지</button>
        <button class="admin-tab" data-tab="retail">상가중개</button>
        <button class="admin-tab" data-tab="franchise">프랜차이즈</button>
        <button class="admin-tab" data-tab="building">빌딩매매</button>
        <button class="admin-tab" data-tab="market">상권분석</button>
      </div>

      <form class="admin-form" data-admin-form></form>

      <section class="review-admin-panel">
        <div class="review-admin-head">
          <div>
            <h2>계약후기 관리</h2>
            <p>후기를 추가하거나 수정하면 메인 페이지와 고객후기 페이지에 바로 반영됩니다.</p>
          </div>
          <button type="button" data-add-review>후기 추가</button>
        </div>
        <div class="review-admin-list" data-review-admin-list></div>
      </section>

      <textarea class="export-box" data-export-box readonly placeholder="JSON 내보내기 결과가 여기에 표시됩니다."></textarea>

      <section style="margin-top: 40px; padding: 20px; background: #f5f5f5; border-radius: 8px; border-left: 4px solid #3B82F6;">
        <h2 style="margin-top: 0; color: #333;">동기화 상태</h2>
        <div id="sync-info" style="font-size: 14px; line-height: 1.8; color: #666;">
          <p><strong>Supabase:</strong> <span id="sync-supabase">확인 중...</span></p>
          <p><strong>마지막 저장:</strong> <span id="sync-time">없음</span></p>
          <p><strong>저장된 항목:</strong> <span id="sync-items">0</span>개</p>
          <p><strong>저장된 후기:</strong> <span id="sync-reviews">0</span>개</p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0"></script>
    <script>
      window.SUPABASE_URL = "https://dwbkwotldcvdzcmfassa.supabase.co";
      window.SUPABASE_KEY = "sb_publishable_6nugV1vM4g-D1AMPQTSPWw_6oIYdbXs";
      window.supabaseReady = false;

      async function initSupabase() {
        const maxWait = 3000;
        const startTime = Date.now();
        while (!window.supabase && Date.now() - startTime < maxWait) {
          await new Promise(resolve => setTimeout(resolve, 50));
        }

        if (window.supabase) {
          try {
            window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
            window.supabaseReady = true;
            console.log("✅ Supabase initialized");
          } catch (err) {
            console.error("❌ Supabase init error:", err);
          }
        } else {
          console.warn("⚠️ Supabase CDN failed to load, using localStorage fallback");
        }
      }
      initSupabase();
    </script>
    <script src="content.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
